name: BOTW IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botw-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-botw:
    name: Build BOTW 1.9.0 unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TITLE_ID: "01007EF00011E000"
      PACKAGE_VERSION: "v1114112"   # 1.9.0
      PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
      HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "=== Disk before cleanup ==="
          df -h
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" || true
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" || true
          rm -rf "$HOME/Library/Caches/Homebrew" || true
          rm -rf "$HOME/.cache/pip" || true
          brew cleanup -s || true
          echo "=== Disk after cleanup ==="
          df -h

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.HOMEBREW_CACHE }}
          key: brew-xcode27-${{ runner.os }}-${{ hashFiles('.github/workflows/botw-ipa.yml') }}
          restore-keys: |
            brew-xcode27-${{ runner.os }}-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-botw-${{ runner.os }}-py313-${{ hashFiles('.github/workflows/botw-ipa.yml') }}
          restore-keys: |
            pip-botw-${{ runner.os }}-py313-

      - name: Verify Xcode + Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -downloadComponent MetalToolchain
          df -h

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p "$HOMEBREW_CACHE" "$PIP_CACHE_DIR"
          export HOMEBREW_CACHE

          brew install xcodegen zstd glslang python@3.13
          brew install --cask dotnet-sdk || true

          PY_BASE="$(brew --prefix python@3.13)/bin/python3.13"
          VENV="$RUNNER_TEMP/botw-venv"
          "$PY_BASE" -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install \
            --cache-dir "$PIP_CACHE_DIR" \
            lz4 "capstone>=5,<6" fonttools nsz zbic "gdown>=5.0" \
            "backports.zstd; python_version < '3.14'"
          echo "PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"

      - name: Download BOTW base + update + prod.keys
        env:
          GAME_BASE_URL: ${{ secrets.BOTW_BASE_URL }}
          GAME_UPDATE_URL: ${{ secrets.BOTW_UPDATE_URL }}
          PROD_KEYS_URL: ${{ secrets.BOTW_PROD_KEYS_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/botw-input" "$RUNNER_TEMP/botw-output"

          if [[ -z "${GAME_BASE_URL:-}" || -z "${GAME_UPDATE_URL:-}" || -z "${PROD_KEYS_URL:-}" ]]; then
            echo "::error::Required secrets missing: BOTW_BASE_URL, BOTW_UPDATE_URL, BOTW_PROD_KEYS_URL"
            exit 1
          fi

          extract_gdrive_id() {
            local url="$1"
            # Prefer sed over bash [[ =~ ]] (ampersand in character class breaks bash)
            echo "$url" | sed -nE \
              -e 's#.*/file/d/([A-Za-z0-9_-]+).*#\1#p' \
              -e 's#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p' \
              -e 's#.*/open\?id=([A-Za-z0-9_-]+).*#\1#p' \
              | head -1
          }

          download_gdrive() {
            local url="$1"
            local out="$2"
            local fid
            fid="$(extract_gdrive_id "$url")"

            echo "Google Drive download → $out"
            if [[ -n "$fid" ]]; then
              echo "File ID: $fid"
            fi

            if [[ -n "$fid" ]]; then
              if "$PYTHON" -m gdown --id "$fid" -O "$out" --continue 2>/tmp/gdown.err; then
                if [[ -s "$out" ]]; then
                  echo "gdown (id) OK"
                  return 0
                fi
              fi
              echo "gdown (id) failed:"
              cat /tmp/gdown.err || true
            fi

            if "$PYTHON" -m gdown "$url" -O "$out" --continue 2>/tmp/gdown.err; then
              if [[ -s "$out" ]]; then
                echo "gdown (url) OK"
                return 0
              fi
            fi
            echo "gdown (url) failed:"
            cat /tmp/gdown.err || true

            if [[ -n "$fid" ]]; then
              echo "Trying curl + confirm token..."
              local tmphtml conf
              tmphtml="$(mktemp)"
              curl -sL -c /tmp/gdrive.cookies -b /tmp/gdrive.cookies \
                "https://drive.google.com/uc?export=download&id=${fid}" -o "$tmphtml" || true

              conf="$(grep -oE 'confirm=[-0-9A-Za-z_]+' "$tmphtml" | head -1 | cut -d= -f2 || true)"
              if [[ -z "$conf" ]]; then
                conf="$(grep -oE 'name="confirm" value="[^"]+"' "$tmphtml" | head -1 | sed -E 's/.*value="([^"]+)".*/\1/' || true)"
              fi
              rm -f "$tmphtml"

              if [[ -n "$conf" ]]; then
                echo "Confirm token: $conf"
                curl --fail --location --retry 3 --retry-delay 2 \
                  -c /tmp/gdrive.cookies -b /tmp/gdrive.cookies \
                  -o "$out" \
                  "https://drive.google.com/uc?export=download&confirm=${conf}&id=${fid}"
              else
                curl --fail --location --retry 3 --retry-delay 2 \
                  -c /tmp/gdrive.cookies -b /tmp/gdrive.cookies \
                  -o "$out" \
                  "https://drive.google.com/uc?export=download&id=${fid}&confirm=t"
              fi

              if [[ -s "$out" ]]; then
                if file "$out" | grep -qi 'HTML\|ASCII text'; then
                  echo "::error::Download looks like an HTML page, not the file. Drive still blocked."
                  head -c 400 "$out" || true
                  rm -f "$out"
                  return 1
                fi
                echo "curl fallback OK"
                return 0
              fi
            fi

            echo "::error::All Google Drive download methods failed for: $url"
            echo "Make sure Share = Anyone with the link (Viewer)."
            echo "Large files often need a non-Drive host (Mega, catbox, direct HTTPS)."
            return 1
          }

          download() {
            local url="$1"
            local out="$2"
            case "$url" in
              *drive.google.com*|*docs.google.com*)
                download_gdrive "$url" "$out"
                ;;
              https://*|http://*)
                curl --fail --location --retry 5 --retry-delay 3 -o "$out" "$url"
                ;;
              *)
                echo "::error::Only HTTPS or Google Drive links supported"
                exit 1
                ;;
            esac
            test -s "$out"
            echo "Downloaded: $out ($(du -h "$out" | cut -f1))"
          }

          download "$GAME_BASE_URL"   "$RUNNER_TEMP/botw-input/BOTW-base.nsp"
          download "$GAME_UPDATE_URL" "$RUNNER_TEMP/botw-input/BOTW-update-1.9.0.nsp"
          download "$PROD_KEYS_URL"   "$RUNNER_TEMP/prod.keys"

          echo "INPUT_DIR=$RUNNER_TEMP/botw-input" >> "$GITHUB_ENV"
          echo "KEYS_FILE=$RUNNER_TEMP/prod.keys"  >> "$GITHUB_ENV"

      - name: Build BOTW 1.9.0 unsigned IPA
        run: |
          set -euo pipefail
          OUT_IPA="$RUNNER_TEMP/botw-output/BOTW-1.9.0.ipa"

          "$PYTHON" scripts/build_ipa_from_nsp.py "$INPUT_DIR" \
            --keys "$KEYS_FILE" \
            --title-id "$TITLE_ID" \
            --package "$PACKAGE_VERSION" \
            --romfs bundle \
            --keep-extracted \
            --out "$OUT_IPA" \
            --progress lines

          test -s "$OUT_IPA"
          ls -lh "$OUT_IPA"
          echo "OUT_IPA=$OUT_IPA" >> "$GITHUB_ENV"

      - name: Upload BOTW IPA
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-1.9.0-unsigned-ipa
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: botw-build-logs
          path: |
            ${{ runner.temp }}/botw-input/01007EF00011E000_build/logs
          if-no-files-found: ignore
          retention-days: 3
